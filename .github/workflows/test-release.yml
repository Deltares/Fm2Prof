name: Test Release Package

on:
  workflow_run:
    workflows: ["Automated release workflow"]
    types:
      - completed
  workflow_dispatch:    # Manual trigger for testing

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    # Only run if workflow_run completed successfully or manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get latest release tag
        id: get_release
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest release tag: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create clean virtual environment
        run: |
          python -m venv test_env
          source test_env/bin/activate
          python -m pip install --upgrade pip
          pip list

      - name: Get wheel file
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Downloading wheel from release ${{ steps.get_release.outputs.tag }}"
            gh release download ${{ steps.get_release.outputs.tag }} \
              --pattern "*.whl" \
              --dir ./
          else
            echo "Manual trigger - building wheel from current branch"
            # Install uv for building
            curl -LsSf https://astral.sh/uv/install.sh | sh
            source $HOME/.cargo/env
            
            # Verify lock file and install dependencies for building
            uv lock --check || uv lock
            uv sync --frozen --group dev
            
            # Build wheel from current source
            uv build
            mv dist/*.whl ./
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wheel in clean environment
        run: |
          source test_env/bin/activate
          WHEEL_FILE=$(ls *.whl)
          echo "Installing wheel: $WHEEL_FILE"
          pip install "$WHEEL_FILE"

          # Verify installation
          echo "Installed packages:"
          pip list

      - name: Install test dependencies
        run: |
          source test_env/bin/activate
          pip install pytest pytest-cov

      - name: Run tests with installed package
        run: |
          source test_env/bin/activate
          pytest -vvv --tb=short || echo "tests failed"
